name: CI

on:
  push:
  pull_request:

# Windows runner 的管道默认 ANSI 代码页，中文输出会 UnicodeEncodeError；
# 全局强制 Python UTF-8 模式（stdout / open() / 子进程一并对齐）。
env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      # v6 起运行在 Node 24（v5 的 Node 20 已被 runner 强制升级并告警），
      # 且 tool-cache 下载对 5xx 有更完整的重试；Windows 上拉 Python 3.10
      # 曾因 CDN 504 导致整个矩阵仅该节点失败。
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile check
        run: python -m compileall -q src

      - name: CLI smoke
        env:
          PYTHONPATH: src
        run: |
          python -m tokenboard --version
          python -m tokenboard platforms
          python -m tokenboard scan --path tests/fixtures/workbuddy.jsonl --format table

      - name: MCP handshake
        run: python scripts/smoke_mcp.py

      - name: Skill pack
        run: python scripts/pack_skill.py
